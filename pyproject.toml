[project]
name = "novelos"
version = "0.1.0"
description = "NovelOS 2.0 deterministic Python Core"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
novelos = "novelos.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "l0: in-process Core unit tests (no subprocess, no model)",
  "l1: subprocess CLI contract tests",
  "l3: deterministic fixture-driven CLI chain",
]
